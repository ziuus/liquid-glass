name: CI & Release

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install Linux Wayland dev libs
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev libsdl2-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Build demo binary
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cargo build --release -p simple-demo
          tar -czf liquid-glass-demo-linux-x86_64.tar.gz -C target/release simple-demo
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: liquid-glass-demo-linux-x86_64.tar.gz
