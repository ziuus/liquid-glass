name: Feature Request
description: Suggest an idea or new glass component for Liquid Glass
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We love new ideas! Share components or shader features you'd like to see.
  - type: textarea
    id: feature-description
    attributes:
      label: Feature Description
      description: What would you like to see added?
      placeholder: Describe the component, shader effect, or platform feature.
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use Case / Motivation
      description: Why would this be useful for apps or desktop widgets?
    validations:
      required: true
  - type: textarea
    id: visual-reference
    attributes:
      label: Visual Reference or Mockup
      description: Links, screenshots, or design references (e.g. macOS, visionOS, iOS).
