[package]
name = "glass-platform"
version = "0.1.0"
edition = "2021"
description = "Cross-platform wallpaper & compositor capability adapter for the Liquid Glass UI engine"
license = "MIT"
repository = "https://github.com/ziuus/liquid-glass"
readme = "../README.md"
keywords = ["wayland", "wallpaper", "glassmorphism", "linux", "desktop"]
categories = ["os", "gui"]

[dependencies]
log = { workspace = true }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = { workspace = true }
wayland-protocols = { workspace = true }
wayland-protocols-plasma = { workspace = true, features = ["client"] }
libc = "0.2"
