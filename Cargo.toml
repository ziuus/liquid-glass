[workspace]
members = [
    "glass-core",
    "glass-ui",
    "glass-platform",
    "examples/simple-window",
    "examples/simple-demo",
    "examples/sdl-widget",
    "benchmarks/bench-surfaces"
]
resolver = "2"

[workspace.dependencies]
wgpu = "0.19"
bytemuck = { version = "1.14", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
wayland-client = "0.31"
wayland-protocols = "0.31"
wayland-protocols-plasma = "0.2"
raw-window-handle = "0.6"

[profile.dev.package."*"]
opt-level = 2
