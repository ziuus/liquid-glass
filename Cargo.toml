[workspace]
members = [
    "benchmarks/bench-surfaces",
    "examples/glass-panel",
    "examples/simple-window",
    "examples/simple-demo",
    "examples/sdl-widget",
    "glass-core",
    "glass-platform",
    "glass-ui"
]
resolver = "2"

[workspace.dependencies]
wgpu = "0.19"
bytemuck = { version = "1.14", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
wayland-client = "0.31"
wayland-protocols = "0.31"
wayland-protocols-wlr = "0.2"
raw-window-handle = "0.6"
smithay-client-toolkit = "0.18"
