[package]
name = "glass-core"
version = "0.1.0"
edition = "2021"
description = "Physical optical lensing & liquid glass GPU rendering engine (WGPU + WGSL + RK4 springs)"
license = "MIT"
repository = "https://github.com/ziuus/liquid-glass"
readme = "../README.md"
keywords = ["glassmorphism", "wgpu", "shader", "ui", "wayland"]
categories = ["graphics", "gui", "rendering"]

[dependencies]
wgpu = { workspace = true }
bytemuck = { workspace = true }
log = { workspace = true }
raw-window-handle = { workspace = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
image = { version = "0.25.10", default-features = false, features = ["png"] }
ab_glyph = "0.2"

[dev-dependencies]
pollster = "0.3"
